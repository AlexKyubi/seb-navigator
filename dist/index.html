<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>Каталог · SEB Navigator</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="stylesheet" href="./assets/shared.css"></head>
<body data-page="catalog"><header class="app-head"><a class="brand" href="index.html"><i>S</i><span><b>SEB</b><small>Navigator</small></span></a><button id="importButton" class="head-action" type="button">Импорт XLSX</button><input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm" hidden></header>
<main class="page catalog-page"><section class="catalog-controls"><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Артикул, модель или название"></label><select id="categorySelect"><option value="all">Все категории</option></select><label class="switch"><input id="focusOnly" type="checkbox" checked><span>С комиссией</span></label></section><section class="catalog-meta"><b id="visibleCount">0</b> товаров <span>·</span> <b id="matchedCount">0</b> со ставкой <em id="fileStatus"></em></section><section id="grid" class="catalog-grid"></section><div id="emptyState" class="empty" hidden>Ничего не найдено</div></main>
<dialog id="importDialog" class="modal"><form method="dialog"><button class="x" value="cancel">×</button><h2>Импорт комиссий</h2><p>Файл сохраняется только на этом устройстве и заменяет текущие ставки.</p><div id="importSummary" class="notice" hidden></div><div class="actions"><button id="chooseFileButton" class="primary" type="button">Выбрать Excel</button><button class="secondary" value="cancel">Отмена</button></div></form></dialog>
<dialog id="saleDialog" class="modal"><form id="saleForm"><button id="closeSaleDialog" class="x" type="button">×</button><div class="sale-product"><img id="saleProductImage" alt=""><div><span id="saleProductArticle"></span><h2 id="saleProductTitle"></h2></div></div><label>Дата продажи</label><input id="saleDate" type="date" required><label>Цена за единицу</label><div class="money"><input id="salePrice" type="number" min="1" step="1" required><span>₸</span></div><label>Количество</label><input id="saleQuantity" type="number" min="1" step="1" value="1" required><div class="rate-note"><span>Ставка ниже 100%</span><b id="saleBelowRate"></b></div><div class="salary-preview"><span>Начисление сейчас</span><b id="saleSalaryPreview">0 ₸</b></div><div id="saleError" class="error"></div><div class="actions"><button class="primary" type="submit">Добавить продажу</button><button id="cancelSaleButton" class="secondary" type="button">Отмена</button></div></form></dialog>
<nav class="bottom-nav"><a class="active" href="index.html"><span>▦</span>Каталог</a><a href="overview.html"><span>◫</span>Обзор</a><a href="sales.html"><span>≡</span>Продажи</a></nav><div id="toast" class="toast"></div><script async src="./assets/xlsx.full.min.js"></script><script type="module" src="./assets/catalog.js"></script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>Продажи · SEB Navigator</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="stylesheet" href="./assets/shared.css"></head><body data-page="sales"><header class="app-head"><a class="brand" href="index.html"><i>S</i><span><b>SEB</b><small>Navigator</small></span></a><button id="exportButton" class="head-action">Отчёт и поделиться</button></header><main class="page sales-page"><section class="sales-title"><div><span>Личный кабинет</span><h1>Продажи</h1></div></section><section class="date-filter"><label>С<input id="dateFrom" type="date"></label><label>По<input id="dateTo" type="date"></label></section><section class="sales-tools"><div class="search"><span>⌕</span><input id="salesSearch" type="search" placeholder="Артикул, модель или товар"></div><button id="backupExport" class="secondary">Резервная копия</button><button id="backupImport" class="secondary">Восстановить</button><input id="backupFile" type="file" accept="application/json,.json" hidden></section><section class="sales-summary"><div><span>Начислено</span><strong id="filteredSalary">0 ₸</strong></div><div><span>Оборот</span><strong id="filteredRevenue">0 ₸</strong></div><div><span>Товаров</span><strong id="filteredQuantity">0</strong></div><div><span>Возвратов</span><strong id="filteredReturns">0</strong></div></section><section class="panel sales-panel"><div class="panel-title"><div><span>Выбранный период</span><h2>История продаж</h2></div></div><div id="salesList" class="sales-list"></div><div id="salesEmpty" class="empty">Продаж за этот период нет</div></section><p id="exportStatus" class="export-status"></p></main><dialog id="editDialog" class="modal"><form id="editForm"><button id="closeEdit" class="x" type="button">×</button><span class="e
